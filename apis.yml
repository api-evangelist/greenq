aid: greenq
name: GreenQ
description: GreenQ is an Israeli smart waste-management technology company (founded 2015, Jerusalem)
  promoting the "Internet of Garbage" — turning ordinary garbage trucks into smart trucks. Its GreenTrack
  device installs on any collection vehicle to weigh incoming waste and track route, mileage, capacity, time
  and per-bin (single-can-level) pickup data without requiring sensors on the bins, using a patent-pending
  visual-recognition algorithm. A recommendations engine then suggests route-optimization and scheduling
  improvements, surfaced through the GreenQ dashboard of reports and analytics. Collected data can be
  integrated with a municipality's local-authority systems through a private integration API; the company
  publishes no public developer portal, API reference, SDKs, or specification. GreenQ was surfaced as a
  portfolio company of 500 Global (also backed by URBAN-X) and added to the API Evangelist network.
